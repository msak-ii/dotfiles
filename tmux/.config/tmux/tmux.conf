set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g default-shell /opt/homebrew/bin/fish

set -g mouse on

set -g mode-keys vi

set -g status-position top
set -g status 2
set -g status-format[1] "#[fill-terminal]"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-h swap-pane -s '{left-of}'
bind C-j swap-pane -s '{down-of}'
bind C-k swap-pane -s '{up-of}'
bind C-l swap-pane -s '{right-of}'

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_module_bg_color "none"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_session_text ""
set -g @catppuccin_session_bg "none"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_date_time_text " %H:%M "
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"

run '/opt/homebrew/opt/tpm/share/tpm/tpm'
